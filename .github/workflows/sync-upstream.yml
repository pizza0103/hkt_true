name: Sync from kor03fluid

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'pizza0103'
    runs-on: ubuntu-latest
    steps:
      - name: Update main and tags
        env:
          MIRROR_TOKEN: ${{ secrets.PIZZA_MIRROR_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          test -n "$MIRROR_TOKEN"
          git init --bare mirror.git
          cd mirror.git
          git remote add upstream "https://github.com/kor03fluid/${REPO_NAME}.git"
          git fetch upstream '+refs/heads/main:refs/heads/main' '+refs/tags/*:refs/tags/*'
          git remote add destination "https://x-access-token:${MIRROR_TOKEN}@github.com/pizza0103/${REPO_NAME}.git"
          git push --force destination 'refs/heads/main:refs/heads/main'
          git push --force destination 'refs/tags/*:refs/tags/*'
